<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comptador Botifarra</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,Roboto,sans-serif; background:#0a1410; color:#ede4d3; overscroll-behavior:none; }
  body {
    display:flex; flex-direction:column; user-select:none; min-height:100%;
    background:
      radial-gradient(120% 80% at 50% -10%, #123322 0%, #0a1410 60%),
      #0a1410;
  }

  header { text-align:center; padding:16px 8px 12px; border-bottom:1px solid #8a6d3b; }
  header h1 { font-size:26px; letter-spacing:6px; color:#d4af37; font-weight:800; text-shadow:0 1px 8px rgba(212,175,55,.4); }
  .objectiu { font-size:12px; opacity:.7; margin-top:6px; letter-spacing:.5px; }
  .objectiu #objBtn {
    background:none; border:1px solid #8a6d3b; color:#d4af37;
    border-radius:8px; padding:3px 10px; font-size:12px; margin-left:4px;
  }

  .marcador { display:flex; flex:0 0 auto; gap:12px; padding:16px 16px 4px; }
  .equip {
    flex:1; border-radius:16px; padding:16px 8px; text-align:center;
    background:linear-gradient(135deg,#0e4d2c,#0b3a21);
    border:1px solid rgba(138,109,59,.4); position:relative;
  }
  .equip.win { border-color:#d4af37; box-shadow:0 0 0 2px #d4af37 inset, 0 0 18px rgba(212,175,55,.3); }
  .equip .nom { font-size:15px; font-weight:600; padding:2px 4px; opacity:.9; }
  .equip .nom[contenteditable] { outline:none; border-bottom:1px dashed rgba(212,175,55,.4); }
  .equip .total { font-size:60px; font-weight:800; line-height:1.05; color:#d4af37; text-shadow:0 1px 8px rgba(212,175,55,.25); }
  .equip .cames { font-size:12px; opacity:.7; margin-top:2px; min-height:16px; }

  .ronda { flex:1 1 auto; overflow-y:auto; min-height:0; padding:12px 16px 4px; }
  .ronda h2 { font-size:11px; opacity:.6; margin:8px 0 8px; letter-spacing:2px; text-transform:uppercase; }

  .manual { display:flex; gap:10px; margin-bottom:10px; align-items:stretch; }
  .manual button {
    flex:0 0 60px; font-size:28px; font-weight:800; background:#0f2018;
    color:#d4af37; border:1px solid #8a6d3b; border-radius:12px;
  }
  .manual button:active { background:#c9a227; color:#0a1410; }
  .manual input {
    flex:1; text-align:center; font-size:34px; font-weight:800;
    background:#0f2018; color:#d4af37; border:1px solid #8a6d3b;
    border-radius:12px; min-width:0;
  }
  .manual input:focus { outline:2px solid #c9a227; }

  .quick { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .quick button {
    flex:1 1 28%; background:#0f2018; color:#ede4d3; border:1px solid #8a6d3b;
    border-radius:11px; padding:11px 4px; font-size:14px; font-weight:600;
  }
  .quick button:active { background:#c9a227; color:#0a1410; }

  .assign { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .assign .lbl { font-size:12px; opacity:.7; flex:0 0 auto; letter-spacing:.5px; text-transform:uppercase; }
  .assign .segmented { display:flex; flex:1; gap:8px; }
  .assign .segmented button {
    flex:1; padding:13px 4px; border-radius:11px; border:1px solid #8a6d3b;
    background:#0f2018; color:#ede4d3; font-size:14px; font-weight:600;
  }
  .assign .segmented button.sel { background:#c9a227; color:#0a1410; border-color:#c9a227; }

  .preview-box {
    text-align:center; font-size:14px; opacity:.9; margin:4px 0 2px;
    background:#0e3a24; border:1px solid rgba(138,109,59,.4); border-radius:12px; padding:10px;
  }
  .preview-box b { color:#d4af37; font-size:20px; }

  .btns {
    display:flex; gap:10px; padding:12px 16px 14px; flex:0 0 auto;
    position:sticky; bottom:0;
    background:linear-gradient(to top, #0a1410 70%, transparent);
  }
  .btns button {
    flex:1; padding:16px; border:none; border-radius:13px; font-size:15px; font-weight:700;
  }
  .btns .add { background:#c9a227; color:#0a1410; letter-spacing:1px; box-shadow:0 4px 16px rgba(201,162,39,.25); }
  .btns .undo { background:#243530; color:#ede4d3; border:1px solid rgba(138,109,59,.3); flex:0 0 auto; padding:16px 20px; }
  .btns .reset { background:#5e1a1a; color:#ede4d3; flex:0 0 auto; padding:16px 20px; }

  .historial { padding:0 16px 12px; }
  .historial h2 { font-size:11px; opacity:.6; margin:8px 0 6px; letter-spacing:2px; text-transform:uppercase; }
  .hlist { font-size:13px; opacity:.85; background:#0c2418; border:1px solid rgba(138,109,59,.25); border-radius:12px; padding:2px 12px; }
  .hlist:empty { display:none; }
  .hlist div { padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); display:flex; justify-content:space-between; }
  .hlist div:last-child { border-bottom:none; }

  dialog { border:none; border-radius:18px; padding:26px; background:#0e3a24; color:#ede4d3; text-align:center; max-width:82%; border:1px solid rgba(212,175,55,.35); }
  dialog h3 { color:#d4af37; font-size:22px; margin-bottom:12px; }
  dialog button { margin-top:14px; background:#c9a227; color:#0a1410; border:none; padding:13px 28px; border-radius:12px; font-weight:800; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
</style>
</head>
<body>
<header>
  <h1>BOTIFARRA</h1>
  <div class="objectiu">Objectiu: <span id="objVal">101</span> punts · <button id="objBtn">canviar</button></div>
</header>

<div class="marcador">
  <div class="equip" id="eq0">
    <div class="nom" contenteditable="true">Nosaltres</div>
    <div class="total" id="t0">0</div>
    <div class="cames" id="c0"></div>
  </div>
  <div class="equip" id="eq1">
    <div class="nom" contenteditable="true">Ells</div>
    <div class="total" id="t1">0</div>
    <div class="cames" id="c1"></div>
  </div>
</div>

<div class="ronda">
  <h2>Punts d'aquesta mà</h2>
  <div class="manual">
    <button id="minus">−</button>
    <input id="baseInput" type="number" inputmode="numeric" pattern="[0-9]*" value="0" min="0">
    <button id="plus">+</button>
  </div>
  <div class="quick">
    <button data-p="36">36 (mitja)</button>
    <button data-p="72">72 (capot)</button>
    <button data-p="0">Esborra</button>
  </div>

  <div class="assign">
    <span class="lbl">Guanya:</span>
    <div class="segmented">
      <button data-g="0" class="sel" id="g0">Nosaltres</button>
      <button data-g="1" id="g1">Ells</button>
    </div>
  </div>

  <div class="assign">
    <span class="lbl">Multiplicador:</span>
    <div class="segmented">
      <button data-m="1" class="sel">×1</button>
      <button data-m="2">×2 (contro)</button>
      <button data-m="4">×4 (recontro)</button>
      <button data-m="8">×8</button>
    </div>
  </div>

  <div class="preview-box">
    A sumar: <b id="preview">0</b> punts
  </div>
</div>

<div class="btns">
  <button class="undo" id="undo">↶</button>
  <button class="add" id="add">SUMAR MÀ</button>
  <button class="reset" id="reset">↺</button>
</div>

<div class="historial">
  <h2>Historial</h2>
  <div class="hlist" id="hlist"></div>
</div>

<dialog id="winDlg">
  <h3 id="winTxt"></h3>
  <button id="winClose">Nova partida</button>
</dialog>

<script>
let state = { t:[0,0], obj:101, base:0, guanya:0, mult:1, hist:[] };

const $ = id => document.getElementById(id);

function preview(){ return state.base * state.mult; }
function render(){
  $('t0').textContent = state.t[0];
  $('t1').textContent = state.t[1];
  $('objVal').textContent = state.obj;
  $('preview').textContent = preview();
  $('eq0').classList.toggle('win', state.t[0]>=state.obj);
  $('eq1').classList.toggle('win', state.t[1]>=state.obj);
  const h = $('hlist'); h.innerHTML='';
  state.hist.slice().reverse().forEach(r=>{
    const d=document.createElement('div');
    d.innerHTML=`<span>${r.txt}</span><span>${state.getName?'':''}${r.a} - ${r.b}</span>`;
    h.appendChild(d);
  });
}

// entrada manual
const baseInput = $('baseInput');
baseInput.oninput=()=>{ state.base = Math.max(0, parseInt(baseInput.value)||0); $('preview').textContent = preview(); };
$('plus').onclick=()=>{ state.base = (state.base||0)+1; baseInput.value=state.base; render(); };
$('minus').onclick=()=>{ state.base = Math.max(0,(state.base||0)-1); baseInput.value=state.base; render(); };
// botons ràpids
document.querySelectorAll('.quick button').forEach(b=>{
  b.onclick=()=>{ state.base = +b.dataset.p; baseInput.value=state.base; render(); };
});
// guanyador
[$('g0'),$('g1')].forEach(b=>{
  b.onclick=()=>{ state.guanya=+b.dataset.g; $('g0').classList.toggle('sel',state.guanya===0); $('g1').classList.toggle('sel',state.guanya===1); };
});
// multiplicador
document.querySelectorAll('[data-m]').forEach(b=>{
  b.onclick=()=>{ state.mult=+b.dataset.m; document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('sel',x===b)); render(); };
});

$('add').onclick=()=>{
  const pts=preview();
  if(pts<=0){ return; }
  state.t[state.guanya]+=pts;
  const n0=document.querySelectorAll('.nom')[0].textContent;
  const n1=document.querySelectorAll('.nom')[1].textContent;
  state.hist.push({txt:`${state.guanya===0?n0:n1} +${pts}`, a:state.t[0], b:state.t[1], pts, who:state.guanya});
  state.base=0;
  baseInput.value=0;
  render();
  const w = state.t[0]>=state.obj || state.t[1]>=state.obj;
  if(w){
    const winner = state.t[0]>state.t[1]?n0:n1;
    $('winTxt').textContent = `🏆 ${winner} guanya!`;
    $('winDlg').showModal();
  }
};

$('undo').onclick=()=>{
  const last=state.hist.pop();
  if(last){ state.t[last.who]-=last.pts; render(); }
};

$('reset').onclick=()=>{
  if(confirm('Reiniciar la partida?')){ state.t=[0,0]; state.hist=[]; state.base=0; baseInput.value=0; render(); }
};

$('objBtn').onclick=()=>{
  const v=prompt('Punts per guanyar:', state.obj);
  const n=parseInt(v);
  if(n>0){ state.obj=n; render(); }
};

$('winClose').onclick=()=>{
  $('winDlg').close();
  state.t=[0,0]; state.hist=[]; state.base=0; baseInput.value=0; render();
};

render();
</script>
</body>
</html>
